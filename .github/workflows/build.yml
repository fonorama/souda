name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and list files
        run: |
          for f in *.zip; do unzip -o "$f"; done
          find . -not -path "./.git/*" | head -40
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          P=$(find . -name prepare.sh -not -path "./.git/*" | head -1)
          if [ -z "$P" ]; then echo "prepare.sh not found - wrong zip file"; exit 1; fi
          cd "$(dirname "$P")"
          bash prepare.sh
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.apk
